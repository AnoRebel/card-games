name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (saves CI minutes on rapid pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Analytics ids aren't needed in CI; keep them empty so the build doesn't
      # try to wire a real provider.
      NUXT_RYBBIT_SITE_ID: ""
      NUXT_UMAMI_SITE_ID: ""
      # Deterministic version stamp from the CI checkout (no .git dirty flag).
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      # No bun-version pin: setup-bun reads package.json's `packageManager`
      # field, so the toolchain version lives in exactly one place. Pinning it
      # here as well let the two drift (CI ran 1.3.14 against a bun@1.4.0 pin),
      # which is the kind of gap that surfaces on a lockfile-format change.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Cache the global bun install store keyed on the lockfile.
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      # The type-debt baseline this step used to tolerate is cleared (the
      # nuxt-i18n-micro $t return type is handled by using $ts, and the tsconfig
      # no longer clobbers Nuxt's path aliases), so typecheck is now blocking.
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
